<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Django Clone</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Axios for API calls -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-[#212121] text-gray-100">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [messages, setMessages] = React.useState([
                { role: 'assistant', content: 'Hello! I am connected to your Django backend.' }
            ]);
            const [input, setInput] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;

                const userMessage = input.trim();
                setInput('');
                const newHistory = [...messages, { role: 'user', content: userMessage }];
                setMessages(newHistory);
                setLoading(true);

                try {
                    const response = await axios.post('http://localhost:8000/api/chat/', {
                        message: userMessage,
                        history: newHistory.slice(0, -1)
                    });
                    setMessages([...newHistory, { role: 'assistant', content: response.data.reply }]);
                } catch (err) {
                    setMessages([...newHistory, { role: 'assistant', content: 'Error connecting to Django backend.' }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex h-screen flex-col justify-between max-w-3xl mx-auto p-4">
                    <div className="flex-1 overflow-y-auto space-y-4 py-4">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`p-3 rounded-xl max-w-lg ${msg.role === 'user' ? 'bg-[#2f2f2f]' : 'bg-transparent'}`}>
                                    <b>{msg.role === 'user' ? 'You' : 'AI'}:</b> {msg.content}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-gray-400 text-sm">Thinking...</div>}
                    </div>
                    <form onSubmit={handleSubmit} className="flex gap-2 pb-4">
                        <input
                            type="text"
                            value={input}
                            onChange={(e) => setInput(e.target.value)}
                            placeholder="Type a message..."
                            className="flex-1 bg-[#2f2f2f] text-white p-3 rounded-xl outline-none"
                        />
                        <button type="submit" className="bg-white text-black px-5 rounded-xl font-medium">Send</button>
                    </form>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
